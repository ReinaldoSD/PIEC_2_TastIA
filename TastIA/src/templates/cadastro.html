<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | TastIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="min-h-screen bg-blue-50 flex items-center justify-center text-slate-800 p-6">
    <div class="w-full max-w-md bg-white rounded-2xl border border-blue-100 p-8 shadow-sm">
        <div class="text-center mb-8">
            <a href="{{ url_for('index') }}" class="inline-block mb-4">
                <img src="{{ url_for('static', filename='imagens/logo.png') }}" alt="Logo TastIA" class="h-14 w-14 mx-auto rounded-xl object-contain">
            </a>
            <h1 class="text-2xl font-bold text-slate-800">Crie a sua conta</h1>
            <p class="text-sm text-slate-500 mt-1">Junte-se ao TastIA e reduza o desperdício alimentar.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for category, message in messages %}
                        <div class="p-3 rounded-xl text-sm {{ 'bg-red-50 text-red-700 border border-red-200' if category == 'erro' else 'bg-green-50 text-green-700 border border-green-200' }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('cadastro') }}" method="POST" class="space-y-5">
            <div>
                <label for="nome" class="block text-sm font-semibold text-slate-700 mb-2">Nome completo</label>
                <input type="text" id="nome" name="nome" required placeholder="Seu nome"
                    class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-blue-400 focus:ring-4 focus:ring-blue-100">
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="exemplo@email.com"
                    class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-blue-400 focus:ring-4 focus:ring-blue-100">
            </div>

            <div>
                <label for="senha" class="block text-sm font-semibold text-slate-700 mb-2">Senha</label>
                <input type="password" id="senha" name="senha" required placeholder="••••••••"
                    class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-blue-400 focus:ring-4 focus:ring-blue-100">
            </div>

            <button type="submit"
                class="w-full rounded-xl bg-blue-600 px-6 py-3.5 font-semibold text-white shadow-md hover:bg-blue-700 transition focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2">
                Cadastrar
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-slate-500">
            Já tem uma conta? 
            <a href="{{ url_for('login') }}" class="font-semibold text-blue-600 hover:underline">Entrar</a>
        </p>
    </div>
</body>
</html>
